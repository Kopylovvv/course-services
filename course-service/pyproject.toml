[project]
name = "course-service"
version = "0.1.0"
description = "Course service description"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "sqlalchemy==2.0.54",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

lint = [
    "black==26.5.1",
    "isort==9.0.1",
    "mypy==2.3.1",
    "pylint==4.0.8",
    "radon==6.0.1",
    "ruff==0.16.8",
]
test = [
    "aiosqlite==0.22.1",
    "httpx2==2.13.0",
    "locust==2.46.5",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
precision = 1

[tool.isort]
profile = "black"
known_first_party = ["src"]
src_paths = ["."]
skip_gitignore = true

[tool.mypy]
files = ["src"]
python_version = "3.14"
strict = true
warn_unused_configs = true
pretty = true

[tool.ruff]
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
docstring-code-format = true

[tool.black]
target-version = ["py314"]

[tool.radon]
show_complexity = true
average = true
show_mi = true

[tool.pylint.main]
py-version = "3.14"

[tool.pylint.format]
max-line-length = 88
